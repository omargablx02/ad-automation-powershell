name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Parse and lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Parse every script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
              $file   = $_
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$errors)

              if ($errors.Count -gt 0) {
                  $failed = $true
                  foreach ($e in $errors) {
                      Write-Host "::error file=$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                  }
              }
              else {
                  Write-Host "OK  $($file.Name)"
              }
          }
          if ($failed) { exit 1 }

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: Lint
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
              $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
              exit 1
          }
          Write-Host 'PSScriptAnalyzer: no findings.'

      - name: Validate the sample CSVs
        shell: pwsh
        run: |
          $users = @(Import-Csv ./users.csv)
          $ous   = @(Import-Csv ./OUs_To_Create.csv)

          if ($users.Count -lt 1) { throw 'users.csv has no rows' }
          if (@($users | Where-Object { -not $_.Firstname -or -not $_.Lastname }).Count -gt 0) {
              throw 'users.csv contains an empty first or last name'
          }
          if ($ous.Count -lt 1) { throw 'OUs_To_Create.csv has no rows' }
          if ($ous[0].PSObject.Properties.Name -notcontains 'Name') { throw 'OUs_To_Create.csv is missing Name' }
          if ($ous[0].PSObject.Properties.Name -notcontains 'Path') { throw 'OUs_To_Create.csv is missing Path' }

          Write-Host "users.csv: $($users.Count) users"
          Write-Host "OUs_To_Create.csv: $($ous.Count) OUs"
